# cargo-mutants (`cargo mutants` ): every mutant of the models must be caught by the
# laws (tests/laws.rs) or by Windows' answers (tests/windows.rs).
examine_globs = ["src/model/**/*.rs", "src/case.rs", "src/compare.rs"]
# Equivalent mutants (same output for every input), excluded with the reason:
# - catmull_rom: both pieces are 0 at x = 1 and x = 2, so < and <= agree there
# - wicimage bitmap: `fmt == "alpha8"` only picks the clause a case reaches, not a value
exclude_re = ['\bproofs::', 'replace < with <= in catmull_rom', 'replace == with != in bitmap$']
