# The suites' own tests: the case files current, the laws (exhaustive and property-based), every
# clause reached, and the models against Windows' recorded answers (golden/).
name: test

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: test-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: false

jobs:
  msvc:
    runs-on: windows-2025
    timeout-minutes: 15
    strategy:
      matrix:
        include:
          - { target: x86, bits: 32 }
          - { target: x64, bits: 64 }
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Locate the C bindings and MSVC
        shell: pwsh
        run: |
          python -m pip install ziglang==0.14.1
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          $headers = python -c "import pathlib,ziglang; print(pathlib.Path(ziglang.__file__).parent / 'lib/libc/include/any-windows-any')"
          $vs = & "${env:ProgramFiles(x86)}/Microsoft Visual Studio/Installer/vswhere.exe" -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          if (!$vs -or !(Test-Path "$headers/dwrite_3.h")) { throw "MSVC or MinGW-w64 declarations missing" }
          "KZ_HEADERS=$headers" >> $env:GITHUB_ENV
          "KZ_VS=$vs" >> $env:GITHUB_ENV
      - name: Compile and link every module
        shell: cmd
        run: |
          call "%KZ_VS%\Common7\Tools\VsDevCmd.bat" -arch=${{ matrix.target }} -host_arch=x64
          if errorlevel 1 exit /b 1
          python runner/msvc/build.py --mingw-headers "%KZ_HEADERS%" --out out ntcase d2d
      - name: Compare MSVC output with Windows recordings
        shell: bash
        run: |
          for suite in ntcase d2d; do
            name="$suite-${{ matrix.bits }}"
            "out/msvc_$name.exe" > "$name.txt"
            diff --strip-trailing-cr -u "golden/$name/stdout.txt" "$name.txt"
          done

  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7.0.1
      - run: rustup toolchain install --no-self-update && echo "RUST_KEY=$(rustc -V | cut -d' ' -f2)" >> "$GITHUB_ENV"
      - id: cache
        uses: actions/cache/restore@v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: test-${{ env.RUST_KEY }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: test-${{ env.RUST_KEY }}-
      - run: python3 -B tests/golden.py
      - name: Laws, case files, clauses, models against Windows
        run: cargo test --release --no-fail-fast -- --nocapture 2>&1 | tee test.log; exit ${PIPESTATUS[0]}
      # (clippy's type-safety and robustness lints and the masu-* checks, per file: they only go
      # down; tools/lint (kikizake-lint), a copy of masu's masu-lint ratchet)
      - name: Lint ratchet
        if: ${{ !cancelled() }}
        timeout-minutes: 10
        run: cargo run -q --release -p kikizake-lint
      # (each counted lint against tools/lint-fixtures/ratchet, one marked line per regression: a
      # lint a clippy upgrade renamed or a clippy.toml path that stopped resolving fails here)
      - name: Lint ratchet fixtures
        if: ${{ !cancelled() }}
        run: cargo test -q --release -p kikizake-lint
      - name: Summary
        if: always()
        run: |
          grep -E '^kikizake_|test result' test.log >> "$GITHUB_STEP_SUMMARY" || true
          set -o pipefail
          cargo run -q --release -- spec | tail -1 >> "$GITHUB_STEP_SUMMARY"
          # (each clause's evidence: cases against Windows, laws; and the gaps per API)
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          cargo run -q --release -- trace | grep '^#' >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
      # (only the registry crates' builds are worth keeping)
      - if: ${{ !cancelled() && steps.cache.outputs.cache-hit != 'true' }}
        run: rm -rf target/debug/incremental target/debug/deps/*kikizake* target/debug/.fingerprint/kikizake-*
      - if: ${{ !cancelled() && steps.cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ steps.cache.outputs.cache-primary-key }}

  d3d12-wait:
    runs-on: windows-2025
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Check the D3D12 readback barrier
        shell: bash
        run: |
          gcc -O2 -o wait-test.exe tests/d3d12_wait.c -luuid
          test "$(./wait-test.exe completed | tr -d '\r')" = "ready for readback"
          for scenario in signal register timeout early removed; do
            status=0
            output=$(./wait-test.exe "$scenario") || status=$?
            test "$status" = 125
            [[ "$output" == "measurement failed: d3d12 wait "* ]]
            [[ "$output" != *"ready for readback"* ]]
          done
