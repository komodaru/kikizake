# The formal laws of spec/laws.txt that cargo test cannot run: the Kani proofs (src/proofs.rs and
# the models' #[cfg(kani)] harnesses), the TLA+ specs (spec/tla), each TLC state replayed
# against the models (`kikizake tla`, every state's calls and the answers the spec says), and the
# Lean proofs (spec/lean), their definitions held equal to the models' functions (`kikizake lean`).
name: formal

on:
  push:
    branches: [main]
    paths: [src/**, spec/**, build.rs, Cargo.toml, Cargo.lock, .github/workflows/formal.yml]
  # (a pull request runs the same proofs: each job is bounded by its timeout, the slowest, Lean's
  # FVF enumeration, about 3 minutes)
  pull_request:
    paths: [src/**, spec/**, build.rs, Cargo.toml, Cargo.lock, .github/workflows/formal.yml]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: formal-${{ github.ref }}
  cancel-in-progress: true

jobs:
  kani:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/cache@v6.1.0
        with:
          path: |
            ~/.cargo/bin/cargo-kani
            ~/.cargo/bin/kani
            ~/.kani
          key: kani-0.68.0
      - run: command -v cargo-kani || cargo install --locked kani-verifier --version 0.68.0
      - run: cargo kani setup
      - name: Kani proofs
        # (a run that verified no harness, or whose summary is missing, is a failure, not a pass:
        # a setup that stopped early or a filter that selected nothing proves nothing)
        run: |
          cargo kani 2>&1 | tee kani.log; s=${PIPESTATUS[0]}
          grep -E "^Checking harness|VERIFICATION|Complete -" kani.log >> "$GITHUB_STEP_SUMMARY"
          [ "$s" -eq 0 ] || exit "$s"
          grep -qE "^Complete - [1-9][0-9]* successfully verified harnesses, 0 failures" kani.log || { echo "no harness verified" | tee -a "$GITHUB_STEP_SUMMARY"; exit 1; }

  lean:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7.0.1
      - run: rustup toolchain install --no-self-update && echo "RUST_KEY=$(rustc -V | cut -d' ' -f2)" >> "$GITHUB_ENV"
      - uses: actions/cache/restore@v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: test-${{ env.RUST_KEY }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: test-${{ env.RUST_KEY }}-
      - uses: actions/cache@v6.1.0
        with:
          path: ~/.elan
          key: elan-${{ hashFiles('spec/lean/lean-toolchain') }}
      - run: |
          test -x ~/.elan/bin/lake || curl -fsSL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Lean proofs (every theorem; a warning, sorry among them, is an error)
        working-directory: spec/lean
        run: lake build
      - run: cargo build -q --release
      - name: The Lean definitions against the models
        run: |
          set -o pipefail
          target/release/kikizake lean spec/lean/.lake/build/bin/mirror | tee lean.log
          grep -E "mirrors|DIFFER" lean.log >> "$GITHUB_STEP_SUMMARY"
          grep -qE "mirrors" lean.log || { echo "no mirror compared" | tee -a "$GITHUB_STEP_SUMMARY"; exit 1; }

  tla:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7.0.1
      - run: rustup toolchain install --no-self-update && echo "RUST_KEY=$(rustc -V | cut -d' ' -f2)" >> "$GITHUB_ENV"
      - uses: actions/cache/restore@v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: test-${{ env.RUST_KEY }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: test-${{ env.RUST_KEY }}-
      - uses: actions/cache@v6.1.0
        with:
          path: ~/tla2tools.jar
          key: tla2tools-1.8.0
      - run: test -f ~/tla2tools.jar || curl -fsSL -o ~/tla2tools.jar https://github.com/tlaplus/tlaplus/releases/download/v1.8.0/tla2tools.jar
      - run: cargo build -q --release
      - name: TLC and the replay
        run: |
          set -o pipefail
          cd spec/tla
          n=0
          for cfg in *.cfg; do
            n=$((n + 1))
            m=${cfg%.cfg}
            java -XX:+UseParallelGC -cp ~/tla2tools.jar tlc2.TLC -workers auto -metadir "$RUNNER_TEMP/$m" -dump "$RUNNER_TEMP/$m.dump" -config "$cfg" "$m.tla" | tail -4
            r=$(../../target/release/kikizake tla "$RUNNER_TEMP/$m.dump")
            echo "$m: $r" | tee -a "$GITHUB_STEP_SUMMARY"
            case "$r" in *" 0 differ "*) ;; *) exit 1 ;; esac
          done
          [ "$n" -gt 0 ] || { echo "no TLA+ configuration" | tee -a "$GITHUB_STEP_SUMMARY"; exit 1; }
