[package]
name = "kikizake-lint"
version = "0.0.0"
edition = "2024"
publish = false
license = "MIT OR Apache-2.0"
description = "kikizake's type-safety lint ratchet over clippy and copied-code check (copies of masu's masu-lint ratchet and dup)"

[dependencies]
kikizake = { path = "../.." }
proc-macro2 = { version = "1", features = ["span-locations"] }
quote = "1"
regex = "1"
serde_json = "1"
syn = { version = "2", features = ["full", "visit"] }

# (as kikizake's own: tests may unwrap, clippy.toml)
[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"

[lints.rust]
# (Rust 1.99: `&x as *const T` / `&mut x as *mut T` makes a reference first, with its aliasing
# rules: write `&raw const x` / `&raw mut x`, or Box::as_ptr)
raw_borrows_via_references = "warn"
