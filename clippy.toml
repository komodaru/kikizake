# (kikizake-lint, tools/lint: tests may unwrap; the code they test may not)
allow-unwrap-in-tests = true
allow-expect-in-tests = true
# (kikizake-lint counts these per file under the masu-* name each reason starts with: unsafe
# functions named by their type, not by a text search)
disallowed-methods = [
    { path = "alloc::vec::Vec::set_len", reason = "masu-set_len: Vec::resize / truncate / a typed buffer" },
    { path = "core::slice::from_raw_parts", reason = "masu-from_raw_parts: a Range or a typed view (sake::mem::view)" },
    { path = "core::slice::from_raw_parts_mut", reason = "masu-from_raw_parts: a Range or a typed view (sake::mem::view_mut)" },
    { path = "core::intrinsics::transmute", reason = "masu-transmute: from_le_bytes / a safe cast" },
    { path = "core::mem::transmute_copy", reason = "masu-transmute: from_le_bytes / a safe cast" },
    { path = "core::mem::zeroed", reason = "masu-uninit: Default / a value" },
    { path = "core::mem::MaybeUninit::assume_init", reason = "masu-uninit: a value made whole" },
    # (as masu's: 61153f30 there leaked a name per call; a leak is right once per process, a known
    # site, and kikizake has none)
    { path = "alloc::boxed::Box::leak", reason = "masu-leak: an owner (a static OnceLock, a table entry) or a borrow" },
    { path = "alloc::string::String::leak", reason = "masu-leak: an owner (a static OnceLock, a table entry) or a borrow" },
    { path = "alloc::vec::Vec::leak", reason = "masu-leak: an owner (a static OnceLock, a table entry) or a borrow" },
]
