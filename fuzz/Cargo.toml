# Coverage-guided fuzzing of kikizake (cargo-fuzz, nightly): `cargo +nightly fuzz run cases`.
[package]
name = "kikizake-fuzz"
version = "0.0.0"
publish = false
edition = "2024"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
kikizake = { path = ".." }

[workspace]

[[bin]]
name = "cases"
path = "fuzz_targets/cases.rs"
test = false
doc = false
bench = false

[[bin]]
name = "calls"
path = "fuzz_targets/calls.rs"
test = false
doc = false
bench = false

[lints.rust]
# (Rust 1.99: `&x as *const T` / `&mut x as *mut T` makes a reference first, with its aliasing
# rules: write `&raw const x` / `&raw mut x`, or Box::as_ptr)
raw_borrows_via_references = "warn"
