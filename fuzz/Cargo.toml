# Coverage-guided fuzzing of kikizake (cargo-fuzz, nightly): `cargo +nightly fuzz run cases`.
[package]
name = "kikizake-fuzz"
version = "0.0.0"
publish = false
edition = "2021"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
kikizake = { path = ".." }

[workspace]

[[bin]]
name = "cases"
path = "fuzz_targets/cases.rs"
test = false
doc = false
bench = false

[[bin]]
name = "calls"
path = "fuzz_targets/calls.rs"
test = false
doc = false
bench = false
