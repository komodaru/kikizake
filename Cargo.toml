# kikizake: conformance tests for the Windows graphics APIs (README.md). A workspace of its own,
# with no dependency on the repository around it, so that it can be published by itself.
[package]
name = "kikizake"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
description = "Conformance tests for the Windows graphics APIs: cases, executable specification models, Windows' recorded answers"

[workspace]
members = [".", "tools/lint"]

[dependencies]

[dev-dependencies]
proptest = "1.12"
trybuild = "1"

[lints.rust]
# (Rust 1.99: `&x as *const T` / `&mut x as *mut T` makes a reference first, with its aliasing
# rules: write `&raw const x` / `&raw mut x`, or Box::as_ptr)
raw_borrows_via_references = "warn"
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(kani)'] }

# (a value that cannot fail is a type, one that can is a `?`: tests may unwrap, clippy.toml)
[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
